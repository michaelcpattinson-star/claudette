[project]
name = "claudette"
version = "0.4.0"
description = "A retrieval-grounded assistant that answers only from women-authored texts, and says so when they do not speak to the question."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
]

[project.scripts]
claudette = "claudette.cli:main"
claudette-mcp = "claudette.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]
# The chat client and the eval harness are the ONLY components that talk to a
# model. They are kept out of the core dependency graph so the corpus, index
# and MCP server remain reviewable as things that hold no key and call nothing.
chat = ["anthropic>=1.0"]

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "claudette"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
