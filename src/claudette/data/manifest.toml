# The provenance gate.
#
# Claudette can only ever say something that appears in a work listed here.
# The index is built from this file and nothing else, so the guarantee
# "every word came from a woman" is enforced by curation rather than by a
# classifier: adding a work means adding an entry, with the author named,
# and a reviewer can read the whole list in five minutes.
#
# Each work is a Project Gutenberg public-domain text, identified by its
# Gutenberg ID. `claudette verify` re-fetches the header of each and checks
# that the title matches, so an ID typo cannot silently pull in the wrong book.
#
# Known limitation, stated rather than hidden: Gutenberg editions sometimes
# carry a preface or introduction by an editor, and some editors were men.
# `start_after` and `end_before` trim such matter; entries known to need it
# say so. `claudette verify --show` prints the first lines after the marker
# so a reviewer can eyeball the rest.

[corpus]
name = "Claudette corpus"
source = "Project Gutenberg (public domain)"
principle = "Every passage is by a named woman author. Nothing else is indexed."

