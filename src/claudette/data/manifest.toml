# Shelf: thought — political economy, social ethics, organisation, management
# ---------------------------------------------------------------------------

[[work]]
id = 73755
slug = "follett-new-state"
author = "Mary Parker Follett"
title = "The New State: Group Organization the Solution of Popular Government"
year = 1918
shelf = "thought"
why = "The direct historical answer to Taylorism. Follett's management theory — 'power-with' rather than 'power-over', conflict resolved by integration rather than domination — was written while scientific management was ascendant, and was buried by it for fifty years."
# Gutenberg #73755 is the 1918 first edition: the introduction is Follett's own.
# (The 1920 reprint added one by Viscount Haldane; if that edition is ever
# substituted, add a start_after trim.)

